name: junior_test
version: "1.0.0"
config-version: 2

profile: junior_test

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

seeds:
  junior_test:
    # Load every column as text so the data looks exactly as it arrives,
    # spaces and casing included. Cleaning happens in staging.
    +column_types:
      employee_id: varchar
      employee_first_name: varchar
      employee_active_status: varchar
      employee_address_province: varchar
      employee_contract_type: varchar
      created_at: varchar
      visit_id: varchar
      intervention_point_id: varchar
      route_id: varchar
      campaign_id: varchar
      visit_date: varchar
      visit_status: varchar
      updated_at: varchar

models:
  junior_test:
    staging:
      +materialized: view
