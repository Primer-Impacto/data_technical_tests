version: 2

models:

  # SOLVED EXAMPLE: quality tests on stg_workers.
  - name: stg_workers
    description: Field workers with normalised province and contract type.
    columns:
      - name: employee_id
        data_tests:
          - unique
          - not_null
      - name: province
        data_tests:
          - not_null
      - name: contract_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['FIJO', 'EV90', 'EV180', 'INDF', 'OBRA', 'UNKNOWN']

